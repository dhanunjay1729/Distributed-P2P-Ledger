name: p2pledger

x-node: &node
  image: p2pledger-node:local
  build: .
  init: true
  restart: unless-stopped
  stop_grace_period: 10s
  mem_limit: 128m
  cpus: 0.5

services:
  node1:
    <<: *node
    environment:
      PORT: "8080"
      NODE_ADDR: "http://node1:8080"
      PEERS_FILE: "/app/config/peers/node1.txt"
      CHAIN_FILE: "/app/data/chain.json"
      DIFFICULTY: "${DIFFICULTY:-2}"
      MINE_INTERVAL: "${MINE_INTERVAL:-10s}"
      SYNC_INTERVAL: "${SYNC_INTERVAL:-5s}"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - node1_data:/app/data

  node2:
    <<: *node
    environment:
      PORT: "8080"
      NODE_ADDR: "http://node2:8080"
